trigger: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Build application
  jobs:
  - job: BuildApplication
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: '8.0.x'

    - bash: |
        set -euo pipefail
        dotnet publish apps/Rapid.Web/Rapid.Web.csproj \
          --configuration Release \
          --output "$(Build.ArtifactStagingDirectory)/published"
      displayName: Publish application

    - task: ArchiveFiles@2
      displayName: Package published application
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/published'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/rapid-web.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/rapid-web.zip'
      artifact: rapid-web
      displayName: Save deployment package

- stage: Deploy
  displayName: Deploy application to Dev
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(variables['Build.Reason'], 'Manual')
    )
  jobs:
  - deployment: DeployApplication
    environment: rapid-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - download: current
            artifact: rapid-web

          - task: AzureCLI@2
            displayName: Deploy application ZIP
            inputs:
              azureSubscription: sc-rapid-platform-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az webapp deploy \
                  --resource-group rg-rapid-platform-dev \
                  --name app-rapid-paas-dev-sathish1az2025 \
                  --src-path "$(Pipeline.Workspace)/rapid-web/rapid-web.zip" \
                  --type zip