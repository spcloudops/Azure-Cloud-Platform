trigger: none

parameters:
- name: operation
  displayName: Session operation
  type: string
  default: plan
  values:
  - plan
  - deploy
  - destroy
- name: enableFirewall
  displayName: Deploy Firewall and routed egress
  type: boolean
  default: false

pool:
  vmImage: ubuntu-latest

variables:
- group: vg-rapid-session-dev
- name: terraformVersion
  value: '1.9.8'

stages:
- stage: Plan
  displayName: Plan session - ${{ parameters.operation }}
  jobs:
  - job: TerraformPlan
    displayName: Validate and save session plan
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        version="$(terraformVersion)"
        package="terraform_${version}_linux_amd64.zip"
        base="https://releases.hashicorp.com/terraform/${version}"

        curl -fsSLo "$package" "$base/$package"
        curl -fsSLo SHA256SUMS "$base/terraform_${version}_SHA256SUMS"
        grep " ${package}$" SHA256SUMS | sha256sum --check

        mkdir -p "$(Agent.TempDirectory)/terraform-bin"
        unzip -o "$package" -d "$(Agent.TempDirectory)/terraform-bin"
        echo "##vso[task.prependpath]$(Agent.TempDirectory)/terraform-bin"
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Initialise, validate and save session plan
      inputs:
        azureSubscription: sc-rapid-platform-dev
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        workingDirectory: '$(Build.SourcesDirectory)/session/dev'
        inlineScript: |
          set -euo pipefail
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true
          export ARM_USE_CLI=false
          export TF_IN_AUTOMATION=true
          case "$SESSION_FIREWALL_ENABLED" in
                   true|True)
                      export TF_VAR_enable_firewall=true
                      ;;
                   false|False)
                      export TF_VAR_enable_firewall=false
                      ;;
                    *)
                      echo "Invalid Firewall selection."
                      exit 1
                      ;;
                  esac

                  echo "Firewall enabled: $TF_VAR_enable_firewall"
          # Confirm that this configuration selects the session state.
          grep -Eq '^[[:space:]]*key[[:space:]]*=[[:space:]]*"rapid-session-dev.tfstate"[[:space:]]*$' \
            dev.backend.hcl

          terraform init -input=false -backend-config=dev.backend.hcl
          terraform validate

          plan_dir="$(Build.ArtifactStagingDirectory)/session-plan"
          mkdir -p "$plan_dir"

          plan_options=()
          if [ "$SESSION_OPERATION" = "destroy" ]; then
            plan_options+=("-destroy")
          fi

          terraform plan -input=false -lock-timeout=60s \
            "${plan_options[@]}" \
            -out="$plan_dir/session.tfplan"

          cp .terraform.lock.hcl "$plan_dir/.terraform.lock.hcl"
      env:
        SESSION_OPERATION: ${{ parameters.operation }}
        TF_VAR_management_admin_password: $(managementAdminPassword)
        SESSION_FIREWALL_ENABLED: '${{ parameters.enableFirewall }}'

    - publish: '$(Build.ArtifactStagingDirectory)/session-plan'
      artifact: session-plan
      displayName: Publish session plan and provider lock file

- stage: ApplySession
  displayName: Apply session - ${{ parameters.operation }}
  dependsOn: Plan
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(variables['Build.Reason'], 'Manual'),
      ne('${{ parameters.operation }}', 'plan')
    )
  jobs:
  - deployment: TerraformApply
    displayName: Apply approved session plan
    environment: rapid-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: session-plan
            displayName: Download saved session plan

          - bash: |
              set -euo pipefail
              version="$(terraformVersion)"
              package="terraform_${version}_linux_amd64.zip"
              base="https://releases.hashicorp.com/terraform/${version}"

              curl -fsSLo "$package" "$base/$package"
              curl -fsSLo SHA256SUMS "$base/terraform_${version}_SHA256SUMS"
              grep " ${package}$" SHA256SUMS | sha256sum --check

              mkdir -p "$(Agent.TempDirectory)/terraform-bin"
              unzip -o "$package" -d "$(Agent.TempDirectory)/terraform-bin"
              echo "##vso[task.prependpath]$(Agent.TempDirectory)/terraform-bin"
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Apply saved session plan
            inputs:
              azureSubscription: sc-rapid-platform-dev
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: '$(Build.SourcesDirectory)/session/dev'
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_USE_CLI=false
                export TF_IN_AUTOMATION=true
                grep -Eq '^[[:space:]]*key[[:space:]]*=[[:space:]]*"rapid-session-dev.tfstate"[[:space:]]*$' \
                  dev.backend.hcl

                cp "$(Pipeline.Workspace)/session-plan/.terraform.lock.hcl" \
                  .terraform.lock.hcl

                terraform init -input=false \
                  -backend-config=dev.backend.hcl \
                  -lockfile=readonly

                terraform apply -input=false -lock-timeout=60s \
                  "$(Pipeline.Workspace)/session-plan/session.tfplan"